<div class="d-flex flex-column h-100">
    <!-- Sidebar Brand Header -->
    <div class="p-3 border-bottom border-secondary mb-2">
        <h5 class="text-white fw-bold mb-0 fs-6">ExamPortal</h5>
        <small class="text-white-50" style="font-size: 0.75rem;">Student Portal</small>
    </div>

    <!-- Navigation Links -->
    <ul class="nav nav-pills flex-column px-3 pb-3 mb-auto" id="student-sidebar">
        <li class="nav-item mb-2">
            <button
                class="nav-link {% if not search %}active{% endif %} text-white text-start w-100 d-flex align-items-center gap-2 py-2 rounded-2"
                data-bs-toggle="pill" data-bs-target="#student-dashboard" type="button">
                <i class="bi bi-speedometer2"></i>My Dashboard
            </button>
        </li>
        <li class="nav-item mb-2">
            <button class="nav-link text-white text-start w-100 d-flex align-items-center gap-2 py-2 rounded-2" data-bs-toggle="pill"
                data-bs-target="#available-examinations" type="button">
                <i class="bi bi-compass"></i>Examination
            </button>
        </li>
        <li class="nav-item mb-2">
            <button class="nav-link text-white text-start w-100 d-flex align-items-center gap-2 py-2 rounded-2" data-bs-toggle="pill"
                data-bs-target="#schedule" type="button">
                <i class="bi bi-book"></i>My Schedule
            </button>
        </li>
        <li class="nav-item mb-2">
            <button class="nav-link text-white text-start w-100 d-flex align-items-center gap-2 py-2 rounded-2" data-bs-toggle="pill"
                data-bs-target="#results" type="button">
                <i class="bi bi-book"></i>My Result
            </button>
        </li>
    </ul>

    
    <div class="p-3 border-top border-secondary mt-auto">
        <a class="nav-link text-danger text-start w-100 d-flex align-items-center gap-2 py-2 rounded-2 bg-danger bg-opacity-10"
            href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right"></i>Logout
        </a>
    </div>
</div>
