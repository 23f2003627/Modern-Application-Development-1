<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <title>Login</title>
</head>

<body class="bg-body-secondary">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0">
          
          <div class="card-header bg-dark text-white text-center py-3">
            <h4 class="mb-0">Exam Portal Login</h4>
          </div>

          <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
              {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control bg-light" placeholder="Enter your email" required>
              </div>
              
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control bg-light" placeholder="Enter your password" required>
              </div>
              
              <button class="btn btn-dark w-100 mt-2">Login</button>
            </form>

            <p class="mt-3 text-center mb-0">
              New User ? <a href="{{ url_for('auth.register') }}" class="text-dark fw-semibold">Register</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

</body>

</html>
